name: G Tech Official Site — PR Checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout site branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q app.py tests
      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -v
        env:
          RAILWAY_ENVIRONMENT: ""
          CRM_LEAD_SYNC_ENABLED: "false"
